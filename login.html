<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Space X | Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100%;background:#000;color:#fff;touch-action:manipulation;overscroll-behavior:none}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;border:1px solid #1b1b1b}.body:before{width:420px;height:420px;top:-210px;right:-180px}body:before{width:420px;height:420px;top:-210px;right:-180px}body:after{width:360px;height:360px;bottom:-210px;left:-180px}.login-shell{width:100%;max-width:430px;position:relative;z-index:2}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:34px}.brand img{width:52px;height:52px;object-fit:contain}.brand-name{font-size:24px;font-weight:700;letter-spacing:1.5px}.card{background:linear-gradient(145deg,#111,#080808 65%,#050505);border:1px solid #292929;border-radius:28px;padding:32px 26px 27px;box-shadow:0 25px 70px rgba(255,255,255,.06)}.eyebrow{color:#777;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}h1{font-size:32px;line-height:1.15;margin-bottom:10px}.subtitle{color:#888;font-size:14px;line-height:1.7;margin-bottom:28px}.field{margin-bottom:16px}label{display:block;color:#aaa;font-size:12px;margin-bottom:8px}.input-wrap{position:relative}input{width:100%;height:54px;padding:0 16px;background:#030303;color:#fff;border:1px solid #303030;border-radius:14px;outline:none;font-size:15px;transition:.25s}input:focus{border-color:#777;box-shadow:0 0 0 3px rgba(255,255,255,.04)}.password-toggle{position:absolute;right:8px;top:8px;height:38px;padding:0 12px;border:1px solid #303030;background:#111;color:# "subtitle">Sign in to continue to your Space X account.</p><div class="field"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" placeholder="Enter your email"></div><div class="field"><label for="password">PASSWORD</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" style="padding-right:82px"><button type="button" class="password-toggle" id="togglePassword">Show</button></div></div><button class="login-btn" id="loginBtn">Sign In</button><div class="register">New to Space X? <a href="register.html">Create an account</a></div><div class="secure"><span class="secure-dot"></span>Secure account authentication</div></section></main><div id="loader"><img src="logo.png" class="loader-logo" alt="Space X"><div class="spinner"></div><div class="loader-text">Signing you in securely...</div></div><div id="success"><div class="success-card"><div class="success-mark">✓</div><h2>Welcome back</h2><p>Your Space X account has been authenticated successfully.</p><button class="continue" onclick="location.href='dashboard.html'">Continue to Dashboard</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",authDomain:"novax-acb23.firebaseapp.com",projectId:"novax-acb23",storageBucket:"novax-acb23.firebasestorage.app",messagingSenderId:"203988106178",appId:"1:203988106178:web:ab32a0c51effd3b5d4f45b"};const app=initializeApp(firebaseConfig),auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);const email=document.getElementById("email"),password=document.getElementById("password"),loginBtn=document.getElementById("loginBtn"),loader=document.getElementById("loader"),success=document.getElementById("success"),togglePassword=document.getElementById("togglePassword");togglePassword.onclick=()=>{const x=password.type==="password";password.type=x?"text":"password";togglePassword.textContent=x?"Hide":"Show"};async function login(){const e=email.value.trim(),p=password.value;if(!e||!p){alert("Please enter your email address and password.");return}loader.style.display="flex";loginBtn.disabled=true;try{await signInWithEmailAndPassword(auth,e,p);loader.style.display="none";success.style.display="flex"}catch(error){loader.style.display="none";loginBtn.disabled=false;let m="Unable to sign in. Please check your email and password.";if(error.code==="auth/invalid-credential")m="The email or password is incorrect.";else if(error.code==="auth/too-many-requests")m="Too many attempts. Please try again later.";alert(m)}}loginBtn.onclick=login;[email,password].forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter")login()}));</script></body></html>
