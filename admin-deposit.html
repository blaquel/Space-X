<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space X Admin | Deposits</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#050505;color:#fff;min-height:100%;overflow-x:hidden}
body{padding:18px 18px 45px}
body:before{content:"";position:fixed;right:-120px;top:-150px;width:380px;height:380px;border-radius:50%;background:rgba(0,255,136,.08);filter:blur(100px);pointer-events:none}
.header{display:flex;align-items:center;justify-content:space-between;max-width:980px;margin:0 auto 22px}
.back{width:45px;height:45px;border:1px solid #292929;border-radius:14px;background:#0c0c0c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer}
.brand{text-align:center}.brand small{display:block;color:#00ff88;font-size:9px;letter-spacing:2px;margin-bottom:3px}.brand h1{font-size:21px}.header-space{width:45px}
.container{max-width:980px;margin:auto}
.summary{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-bottom:15px}
.summary-card{background:linear-gradient(145deg,#111,#080808);border:1px solid #242424;border-radius:24px;padding:22px}
.summary-card small{color:#666;text-transform:uppercase;letter-spacing:1.2px;font-size:10px}
.summary-card h2{font-size:32px;margin-top:9px}.summary-card p{color:#777;font-size:12px;margin-top:7px;line-height:1.6}
.count-card{display:flex;flex-direction:column;justify-content:center}.count-card h2{color:#00ff88}
.notice{display:none;background:#190909;border:1px solid #4b2020;color:#ff8d8d;border-radius:16px;padding:14px;margin-bottom:15px;font-size:12px;line-height:1.6}
.loading{text-align:center;padding:65px 10px;color:#777;font-size:13px}.empty{text-align:center;padding:65px 10px;color:#666}
.deposit{background:linear-gradient(145deg,#111,#080808);border:1px solid #252525;border-radius:23px;padding:20px;margin-bottom:14px;box-shadow:0 15px 45px rgba(0,0,0,.25)}
.deposit-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}
.user h3{font-size:17px}.user small{display:block;color:#666;margin-top:5px;font-size:11px;word-break:break-all}
.status{padding:7px 11px;border:1px solid #765a16;border-radius:30px;color:#ffc94a;font-size:10px;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.item{background:#090909;border:1px solid #1e1e1e;border-radius:14px;padding:13px}
.item label{display:block;color:#555;font-size:9px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}
.item div{font-size:12px;word-break:break-word;color:#ddd}.amount{color:#00ff88!important;font-weight:800;font-size:15px!important}.address{color:#aaa!important}
.actions{display:flex;gap:10px;margin-top:15px}button.action{flex:1;height:45px;border:0;border-radius:12px;font-weight:800;cursor:pointer}
.approve{background:#00ff88;color:#000}.decline{background:#1b1b1b;color:#ff7070;border:1px solid #3a2020!important}
button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.summary-card{padding:18px}.summary-card h2{font-size:25px}.grid{grid-template-columns:1fr 1fr}.deposit{padding:16px}}
@media(max-width:420px){.summary{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="header">
<div class="back" onclick="location.href='admin.html'">←</div>
<div class="brand"><small>SPACE X / ADMIN</small><h1>Deposits</h1></div>
<div class="header-space"></div>
</div>

<div class="container">
<div class="summary">
<div class="summary-card"><small>Deposit management</small><h2>Crypto Funding</h2><p>Review incoming deposit requests and approve verified transactions.</p></div>
<div class="summary-card count-card"><small>Pending requests</small><h2 id="pendingCount">0</h2></div>
</div>

<div id="notice" class="notice"></div>
<div id="loading" class="loading">Loading deposit requests...</div>
<div id="depositList"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {getFirestore,collection,query,where,onSnapshot,doc,updateDoc,getDoc,increment}
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",
authDomain:"novax-acb23.firebaseapp.com",
projectId:"novax-acb23",
storageBucket:"novax-acb23.firebasestorage.app",
messagingSenderId:"203988106178",
appId:"1:203988106178:web:ab32a0c51effd3b5d4f45b"
};

const db=getFirestore(initializeApp(firebaseConfig));
const list=document.getElementById("depositList");
const loading=document.getElementById("loading");
const count=document.getElementById("pendingCount");
const notice=document.getElementById("notice");

function escapeHTML(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatDate(t){
if(!t)return "—";
try{return t.toDate().toLocaleString()}catch{return "—"}
}
function showError(e){
loading.style.display="none";
notice.style.display="block";
notice.innerHTML="<strong>Firebase could not load the deposits.</strong><br>"+escapeHTML(e?.message||"Unknown Firebase error.")+"<br><br>Check your Firestore rules and admin permissions.";
}

const q=query(collection(db,"transactions"),where("type","==","Deposit"),where("status","==","Pending"));

onSnapshot(q,snapshot=>{
loading.style.display="none";
notice.style.display="none";
list.innerHTML="";
count.textContent=snapshot.size;

if(snapshot.empty){
list.innerHTML='<div class="empty">No pending deposit requests found.</div>';
return;
}

snapshot.forEach(item=>{
const d=item.data(),id=item.id;
const amount=Number(d.amount);
const amountText=Number.isFinite(amount)?"$"+amount.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):"—";

list.insertAdjacentHTML("beforeend",`
<div class="deposit">
<div class="deposit-top">
<div class="user"><h3>${escapeHTML(d.username||"Unknown user")}</h3><small>ID: ${escapeHTML(d.userId||"Missing userId")}</small></div>
<div class="status">Pending</div>
</div>
<div class="grid">
<div class="item"><label>Currency</label><div>${escapeHTML(d.currency||"—")}</div></div>
<div class="item"><label>Amount</label><div class="amount">${amountText}</div></div>
<div class="item"><label>Method</label><div>${escapeHTML(d.method||"Crypto")}</div></div>
<div class="item"><label>Date</label><div>${escapeHTML(formatDate(d.createdAt))}</div></div>
<div class="item" style="grid-column:1/-1"><label>Wallet Address</label><div class="address">${escapeHTML(d.walletAddress||"—")}</div></div>
</div>
<div class="actions">
<button class="action approve" data-approve="${id}">Approve Deposit</button>
<button class="action decline" data-decline="${id}">Decline</button>
</div>
</div>`);
});
},showError);

window.approveDeposit=async id=>{
if(!confirm("Approve this deposit and credit the user's balance?"))return;
try{
const tx=doc(db,"transactions",id),snap=await getDoc(tx);
if(!snap.exists())throw new Error("Deposit transaction no longer exists.");
const d=snap.data();
if(d.status!=="Pending")throw new Error("This deposit has already been processed.");
if(!d.userId)throw new Error("This deposit is missing userId.");
const amount=Number(d.amount);
if(!Number.isFinite(amount)||amount<=0)throw new Error("Invalid deposit amount.");
await updateDoc(doc(db,"users",d.userId),{balance:increment(amount)});
await updateDoc(tx,{status:"Approved"});
alert("Deposit approved successfully.");
}catch(e){alert(e.message||"Unable to approve deposit.")}
};

window.declineDeposit=async id=>{
if(!confirm("Decline this deposit request?"))return;
try{await updateDoc(doc(db,"transactions",id),{status:"Declined"});alert("Deposit declined.");}
catch(e){alert(e.message||"Unable to decline deposit.")}
};

document.addEventListener("click",e=>{
const a=e.target.closest("[data-approve]"),d=e.target.closest("[data-decline]");
if(a)window.approveDeposit(a.dataset.approve);
if(d)window.declineDeposit(d.dataset.decline);
});
</script>
</body>
</html>
