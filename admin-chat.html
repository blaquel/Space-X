<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>NovaX Admin Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
padding:20px;
padding-bottom:30px;
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.back{
width:45px;
height:45px;
border:1px solid #fff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
font-size:22px;
}

.header h2{
font-size:28px;
}

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
height:55px;
background:#111;
border:1px solid #2b2b2b;
border-radius:15px;
padding:0 20px;
color:#fff;
font-size:15px;
outline:none;
}

.search-box input:focus{
border-color:#fff;
}

.chat-list{
display:flex;
flex-direction:column;
gap:15px;
}

.chat-card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:18px;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.3s;
}

.chat-card:hover{
border-color:#fff;
}

.left{
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:#fff;
color:#000;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:700;
}

.details h3{
font-size:17px;
margin-bottom:5px;
}

.details p{
color:#999;
font-size:14px;
width:170px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.right{
text-align:right;
}

.time{
font-size:12px;
color:#888;
margin-bottom:10px;
}

.unread-dot{
width:11px;
height:11px;
background:#ff3b30;
border-radius:50%;
margin-left:auto;
}

.empty{
margin-top:80px;
text-align:center;
color:#777;
}

</style>

</head>

<body>

<div class="header">

<div class="back" onclick="location.href='admin.html'">

←

</div>

<h2>Support Chats</h2>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search users...">

</div>

<div id="chatList" class="chat-list">

<div class="empty">

No chats available.

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import { getAuth } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",
authDomain:"novax-acb23.firebaseapp.com",
projectId:"novax-acb23",
storageBucket:"novax-acb23.firebasestorage.app",
messagingSenderId:"203988106178",
appId:"1:203988106178:web:ab32a0c51effd3b5d4f45b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const chatList=document.getElementById("chatList");
const searchInput=document.getElementById("searchInput");

let chats=[];

const chatsQuery=query(
collection(db,"supportChats"),
orderBy("updatedAt","desc")
);

onSnapshot(chatsQuery,(snapshot)=>{

chats=[];

snapshot.forEach(doc=>{

chats.push({
id:doc.id,
...doc.data()
});

});

renderChats(chats);

});

function renderChats(list){

chatList.innerHTML="";

if(list.length===0){

chatList.innerHTML=`
<div class="empty">
No chats available.
</div>
`;

return;

}

list.forEach(chat=>{

const initial=(chat.username||"U")
.charAt(0)
.toUpperCase();

const time=chat.updatedAt
?chat.updatedAt.toDate().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})
:"";

chatList.innerHTML+=`

<div class="chat-card"
onclick="openChat('${chat.id}')">

<div class="left">

<div class="avatar">

${initial}

</div>

<div class="details">

<h3>

${chat.username||"Unknown User"}

</h3>

<p>

${chat.lastMessage||"No messages yet"}

</p>

</div>

</div>

<div class="right">

<div class="time">

${time}

</div>

${chat.unreadForAdmin
?'<div class="unread-dot"></div>'
:''}

</div>

</div>

`;

});

}

searchInput.addEventListener("input",()=>{

const value=searchInput.value
.toLowerCase();

const filtered=chats.filter(chat=>{

return(
(chat.username||"")
.toLowerCase()
.includes(value)

||

(chat.fullname||"")
.toLowerCase()
.includes(value)

);

});

renderChats(filtered);

});

window.openChat=function(chatId){

location.href=
`admin-chat-room.html?id=${chatId}`;

}

</script>


</body>

</html>
