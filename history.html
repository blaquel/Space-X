<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NovaX History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
background:#000;
color:#fff;
overflow-x:hidden;
touch-action:manipulation;
}

body{
padding:20px;
padding-bottom:100px;
}

/* Header */

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:30px;
}

.back{

width:45px;
height:45px;
border:1px solid #fff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
background:#000;

}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
width:42px;
height:42px;
object-fit:contain;
}

.logo h2{
font-size:24px;
font-weight:bold;
}

.space{
width:45px;
}

/* Transaction List */

#history{

display:flex;
flex-direction:column;
gap:18px;

}

/* Card */

.card{

background:#090909;
border:1px solid #222;
border-radius:22px;
padding:20px;
animation:fade .35s ease;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;

}

.type{

font-size:17px;
font-weight:bold;

}

.amount{

font-size:18px;
font-weight:bold;
color:#fff;

}

.info{

display:flex;
justify-content:space-between;
margin-top:10px;
color:#888;
font-size:14px;

}

.status{

display:inline-block;
margin-top:18px;
padding:7px 16px;
border-radius:30px;
font-size:12px;
font-weight:bold;
border:1px solid #444;

}

.pending{

color:#FFD54F;
border-color:#FFD54F;

}

.approved{

color:#00FF99;
border-color:#00FF99;

}

.declined{

color:#FF5252;
border-color:#FF5252;

}

/* Loading */

#loading{

text-align:center;
margin-top:120px;
color:#777;

}

.loader{

width:48px;
height:48px;
margin:auto;
border:4px solid #222;
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:20px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

/* Empty */

.empty{

margin-top:120px;
text-align:center;
color:#666;

}

.empty h3{

margin-bottom:12px;
color:white;

}

.empty p{

line-height:1.6;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="header">

<div class="back" onclick="location.href='dashboard.html'">

←

</div>

<div class="logo">

<img src="logo.png">

<h2>History</h2>

</div>

<div class="space"></div>

</div>

<div id="loading">

<div class="loader"></div>

Loading your transactions...

</div>

<div id="history"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",

authDomain:"novax-acb23.firebaseapp.com",

projectId:"novax-acb23",

storageBucket:"novax-acb23.firebasestorage.app",

messagingSenderId:"203988106178",

appId:"1:203988106178:web:ab32a0c51effd3b5d4f45b"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const loading=document.getElementById("loading");
const history=document.getElementById("history");

onAuthStateChanged(auth,(user)=>{

if(!user){

loading.innerHTML="Please login to view your history.";

return;

}

const q=query(

collection(db,"transactions"),

where("userId","==",user.uid),

orderBy("createdAt","desc")

);

onSnapshot(q,(snapshot)=>{

loading.style.display="none";

history.innerHTML="";

if(snapshot.empty){

history.innerHTML=`

<div class="empty">

<h3>No Transactions</h3>

<p>

Your deposits, withdrawals and investments will appear here.

</p>

</div>

`;

return;

}

snapshot.forEach((doc)=>{

const data=doc.data();

let status=(data.status || "Pending").toLowerCase();

let statusClass="pending";

if(status==="approved"){

statusClass="approved";

}

if(status==="declined"){

statusClass="declined";

}

let amount=Number(data.amount || 0).toLocaleString();

let method=data.method || "-";

let type=data.type || "Transaction";

let date="";

if(data.createdAt){

date=data.createdAt.toDate().toLocaleString();

}

history.innerHTML+=`

<div class="card">

<div class="top">

<div class="type">

${type}

</div>

<div class="amount">

$${amount}

</div>

</div>

<div class="info">

<span>

Method: ${method}

</span>

</div>

<div class="info">

<span>

${date}

</span>

</div>

<div class="status ${statusClass}">

${data.status || "Pending"}

</div>

</div>

`;

});

},(error)=>{

loading.innerHTML=error.message;

});

});

</script>

</body>

</html>
