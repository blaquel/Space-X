<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>NovaX Admin Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#000;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
height:70px;
padding:15px;
display:flex;
align-items:center;
gap:15px;
border-bottom:1px solid #222;
background:#111;
}

.back{
width:42px;
height:42px;
border:1px solid #fff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

.user-info h3{
font-size:18px;
}

.user-info p{
font-size:13px;
color:#999;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.message{
max-width:80%;
padding:14px;
border-radius:18px;
line-height:1.6;
font-size:15px;
word-break:break-word;
}

.admin{
align-self:flex-end;
background:#fff;
color:#000;
border-bottom-right-radius:5px;
}

.user{
align-self:flex-start;
background:#111;
border:1px solid #333;
border-bottom-left-radius:5px;
}

.time{
margin-top:6px;
font-size:11px;
opacity:.7;
}

.input-area{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #222;
background:#111;
}

.input-area input{
flex:1;
height:52px;
border:none;
border-radius:15px;
padding:0 15px;
background:#000;
border:1px solid #333;
color:#fff;
outline:none;
}

.input-area button{
width:90px;
border:none;
border-radius:15px;
background:#fff;
color:#000;
font-weight:600;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<div class="back"
onclick="history.back()">

←

</div>

<div class="user-info">

<h3 id="username">

Loading...

</h3>

<p>

Customer Support Chat

</p>

</div>

</div>

<div
id="messages"
class="messages">

</div>

<div class="input-area">

<input
id="messageInput"
placeholder="Type your reply...">

<button
id="sendBtn">

Send

</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import { getAuth } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore,
doc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",
authDomain:"novax-acb23.firebaseapp.com",
projectId:"novax-acb23",
storageBucket:"novax-acb23.firebasestorage.app",
messagingSenderId:"203988106178",
appId:"1:203988106178:web:ab32a0c51effd3b5d4f45b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const params=new URLSearchParams(location.search);
const chatId=params.get("id");

const username=document.getElementById("username");
const messages=document.getElementById("messages");
const input=document.getElementById("messageInput");
const sendBtn=document.getElementById("sendBtn");

onSnapshot(doc(db,"supportChats",chatId),(snap)=>{

if(!snap.exists()) return;

const data=snap.data();

username.innerText=data.username||"User";

updateDoc(doc(db,"supportChats",chatId),{

unreadForAdmin:false

});

});

const messagesQuery=query(
collection(db,"supportChats",chatId,"messages"),
orderBy("createdAt","asc")
);

onSnapshot(messagesQuery,(snapshot)=>{

messages.innerHTML="";

snapshot.forEach(doc=>{

const data=doc.data();

const time=data.createdAt
?data.createdAt.toDate().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})
:"";

messages.innerHTML+=`

<div class="message ${data.sender}">

${data.text}

<div class="time">

${time}

</div>

</div>

`;

});

messages.scrollTop=messages.scrollHeight;

});

sendBtn.onclick=async()=>{

const text=input.value.trim();

if(text==="") return;

await addDoc(

collection(db,"supportChats",chatId,"messages"),

{

sender:"admin",

text:text,

createdAt:serverTimestamp()

}

);

await updateDoc(

doc(db,"supportChats",chatId),

{

lastMessage:text,

updatedAt:serverTimestamp(),

unreadForUser:true,

unreadForAdmin:false

}

);

input.value="";

};

input.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

sendBtn.click();

}

});

</script>


</body>

</html>
