<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NovaX Deposit</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;
color:white;
padding:20px;

}


.header{

display:flex;
align-items:center;
gap:20px;
margin-bottom:30px;

}


.back{

width:42px;
height:42px;
border:1px solid white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;

}




.balance-box{

background:#090909;
border:1px solid #222;
border-radius:25px;
padding:30px;
text-align:center;
margin-bottom:30px;

}



.label{

color:#777;
font-size:13px;

}



.balance{

font-size:35px;
margin-top:15px;

}






.option{

background:#090909;
border:1px solid #222;
border-radius:20px;
padding:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;

}



.option h3{

font-size:16px;

}



.option span{

color:#888;
font-size:13px;

}




.arrow{

font-size:22px;

}





.disabled{

opacity:.5;
cursor:not-allowed;

}


</style>


</head>


<body>



<div class="header">


<div class="back" onclick="location.href='dashboard.html'">

←

</div>


<h2>
Deposit
</h2>


</div>









<div class="balance-box">


<div class="label">

Current Balance

</div>


<div class="balance">

$<span id="balance">0.00</span>

</div>


</div>









<div class="option" onclick="location.href='crypto.html'">


<div>

<h3>
Crypto
</h3>


<span>
Deposit using cryptocurrency
</span>


</div>


<div class="arrow">
→
</div>


</div>








<div class="option disabled">


<div>

<h3>
PayPal
</h3>


<span>
Coming Soon
</span>


</div>


</div>








<div class="option disabled">


<div>

<h3>
Cash App
</h3>


<span>
Coming Soon
</span>


</div>


</div>









<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";



import {

getAuth,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";



import {

getFirestore,

doc,

onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";







const firebaseConfig = {
  apiKey: "AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",
  authDomain: "novax-acb23.firebaseapp.com",
  projectId: "novax-acb23",
  storageBucket: "novax-acb23.firebasestorage.app",
  messagingSenderId: "203988106178",
  appId: "1:203988106178:web:ab32a0c51effd3b5d4f45b"
};






const app=initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getFirestore(app);






onAuthStateChanged(auth,(user)=>{


if(user){



onSnapshot(

doc(db,"users",user.uid),

(snapshot)=>{


if(snapshot.exists()){


document.getElementById("balance").innerText=

Number(snapshot.data().balance || 0).toFixed(2);


}



}

);



}



});




</script>


</body>

</html>
