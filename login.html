<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>NovaX Login</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;
color:white;
height:100vh;
display:flex;
align-items:center;
justify-content:center;

touch-action:manipulation;

}



.container{

width:90%;
max-width:420px;
background:#090909;
border:1px solid #222;
padding:35px;
border-radius:20px;

}



.logo{

text-align:center;
margin-bottom:25px;

}


.logo img{

width:60px;
height:60px;
object-fit:contain;

}



.logo h2{

margin-top:15px;

}




input{

width:100%;
padding:15px;
margin:10px 0;

background:#000;

border:1px solid #333;

border-radius:12px;

color:white;

font-size:15px;

}




button{

width:100%;
padding:15px;

margin-top:15px;

background:white;

color:black;

border:none;

border-radius:30px;

font-weight:bold;

cursor:pointer;

}



button:disabled{

opacity:.5;

}



p{

text-align:center;
margin-top:20px;
color:#777;

}



a{

color:white;

}




#loader{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.9);

align-items:center;
justify-content:center;

flex-direction:column;

z-index:10;

}



.spinner{

width:45px;
height:45px;

border:4px solid #333;

border-top:4px solid white;

border-radius:50%;

animation:spin 1s linear infinite;

}



@keyframes spin{

100%{

transform:rotate(360deg);

}

}



#success{

display:none;

position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

background:#111;

border:1px solid #333;

padding:30px;

border-radius:20px;

width:85%;

max-width:350px;

text-align:center;

z-index:20;

}



#success button{

margin-top:20px;

}


</style>

</head>



<body>



<div class="container">


<div class="logo">

<img src="logo.png">

<h2>
Welcome Back
</h2>


</div>




<input id="email" type="email" placeholder="Email Address">



<input id="password" type="password" placeholder="Password">




<button id="loginBtn">

Login

</button>




<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>




</div>







<div id="loader">


<div class="spinner"></div>


<p>

Securely signing in...

</p>


</div>







<div id="success">


<h3>

Login Successful

</h3>


<p>

Welcome back to NovaX

</p>


<button onclick="location.href='dashboard.html'">

Continue

</button>


</div>









<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword,

setPersistence,

browserLocalPersistence

}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";






const firebaseConfig = {
  apiKey: "AIzaSyDPEZtkQNsWIiiwc08C-4iHEyDR9N0ZvZc",
  authDomain: "novax-acb23.firebaseapp.com",
  projectId: "novax-acb23",
  storageBucket: "novax-acb23.firebasestorage.app",
  messagingSenderId: "203988106178",
  appId: "1:203988106178:web:ab32a0c51effd3b5d4f45b"
};





const app=initializeApp(firebaseConfig);


const auth=getAuth(app);





// Keep login active

await setPersistence(auth,browserLocalPersistence);







document.getElementById("loginBtn").onclick=async()=>{


const email=document.getElementById("email").value.trim();


const password=document.getElementById("password").value;





if(!email || !password){

alert("Please enter your email and password.");

return;

}




document.getElementById("loader").style.display="flex";


document.getElementById("loginBtn").disabled=true;






try{


await signInWithEmailAndPassword(

auth,

email,

password

);



document.getElementById("loader").style.display="none";


document.getElementById("success").style.display="block";



}

catch(error){



document.getElementById("loader").style.display="none";


document.getElementById("loginBtn").disabled=false;



alert("Login failed. Please check your details.");



}



};



</script>



</body>

</html>
